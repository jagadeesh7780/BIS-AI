services:
  # ─── FastAPI Backend Web Service ─────────────────────────────────────────────
  - type: web
    name: bis-assistant-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANONYMIZED_TELEMETRY
        value: "false"
      - key: CHROMA_TELEMETRY
        value: "false"
      - key: GROQ_API_KEY
        sync: false

  # ─── React Frontend Static Site ──────────────────────────────────────────────
  - type: web
    name: bis-assistant-frontend
    env: static
    rootDir: bis-assistant-ai
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bis-assistant-backend
          property: host
